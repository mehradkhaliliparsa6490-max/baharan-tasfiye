<script>
'use strict';

/* ================= پنل دیباگ ================= */
const Debug = {
  logs: [],
  el: null,
  init() {
    this.el = document.getElementById('debugLogs');
    this.add('info', 'سیستم دیباگ راه‌اندازی شد (v1.1.100)');
    
    // اینترنت
    window.addEventListener('online', () => this.updateNet(true));
    window.addEventListener('offline', () => this.updateNet(false));
    this.updateNet(navigator.onLine);

    // بررسی دوره‌ای سرور
    setInterval(() => this.pingServer(), 15000);
    this.pingServer();
  },
  add(type, msg) {
    const time = new Date().toLocaleTimeString('fa-IR');
    this.logs.push({ time, type, msg });
    if (this.logs.length > 200) this.logs.shift();
    
    const color = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warn' ? 'warn' : 'info';
    const html = `<div class="log-row ${color}"><span class="log-time">${time}</span><span class="log-tag">[${type.toUpperCase()}]</span>${msg}</div>`;
    
    if (this.el) {
      this.el.insertAdjacentHTML('beforeend', html);
      this.el.scrollTop = this.el.scrollHeight;
    }
    if (type === 'error') {
      document.getElementById('debugBtn').classList.add('has-err');
    }
    console.log(`[${type.toUpperCase()}] ${msg}`);
  },
  clear() {
    this.logs = [];
    if (this.el) this.el.innerHTML = '';
    document.getElementById('debugBtn').classList.remove('has-err');
    this.add('info', 'لاگ‌ها پاک شد');
  },
  updateNet(isOnline) {
    const el = document.getElementById('dbgNet');
    if (isOnline) {
      el.innerHTML = '<div class="dot-green"></div> اینترنت';
      this.add('success', 'اتصال به اینترنت برقرار است.');
    } else {
      el.innerHTML = '<div class="dot-red"></div> اینترنت';
      this.add('error', 'اتصال به اینترنت قطع شد!');
    }
  },
  async pingServer() {
    if (!supabaseClient) {
      document.getElementById('dbgSrv').innerHTML = '<div class="dot-red"></div> سرور';
      return;
    }
    try {
      const start = Date.now();
      // درخواست ساده برای چک کردن سرور
      const { data, error } = await supabaseClient.from('baharan_data').select('id').limit(1);
      const ping = Date.now() - start;
      
      if (error) throw error;
      
      document.getElementById('dbgSrv').innerHTML = '<div class="dot-green"></div> سرور';
      if (Date.now() - (this._lastPing || 0) > 30000) { // هر ۳۰ ثانیه یکبار لاگ بدهد که لاگ پر نشود
        this.add('success', `اتصال به سرور Supabase برقرار است (پینگ: ${ping}ms)`);
        this._lastPing = Date.now();
      }
    } catch (err) {
      document.getElementById('dbgSrv').innerHTML = '<div class="dot-red"></div> سرور';
      this.add('error', `خطا در اتصال به سرور: ${err.message || JSON.stringify(err)}`);
    }
  }
};

function toggleDebug() {
  const panel = document.getElementById('debugPanel');
  panel.classList.toggle('open');
}
Debug.init();

/* ================= تنظیمات Supabase ================= */
const SUPABASE_URL = 'https://lovgxgphwbumjcuwqsba.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvdmd4Z3Bod2J1bWpjdXdxc2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NDUyODIsImV4cCI6MjExMDEyMTI4Mn0.fElB1vCYOaFQ8-k8K91d87aPOXLXdMp9XUoo7ozMgik';

let supabaseClient = null;
try {
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 2 } }
    });
    Debug.add('success', 'کلاینت Supabase مقداردهی اولیه شد.');
  } else {
    throw new Error('کتابخانه Supabase لود نشد (مشکل در CDN)');
  }
} catch (e) {
  Debug.add('error', e.message);
}

// سیستم آنلاین بودن کاربران (Presence)
let onlineCount = 0;
const myClientId = 'client_' + Math.random().toString(36).slice(2, 9);
if (supabaseClient) {
  const channel = supabaseClient.channel('online_users', { config: { presence: { key: myClientId } } });
  channel
    .on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      onlineCount = Object.keys(state).length;
      document.getElementById('dbgUsers').innerText = `👤 ${onlineCount} آنلاین`;
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.track({ online_at: new Date().toISOString() });
        Debug.add('info', 'اتصال Realtime (تعداد کاربران آنلاین) برقرار شد.');
      } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
        document.getElementById('dbgUsers').innerText = `👤 نامشخص`;
        Debug.add('warn', 'اتصال Realtime قطع شد.');
      }
    });
}

/* ================= تنظیمات پایه ================= */
const KEY='baharan_office_v1';
const $=s=>document.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const money=n=>fa(String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

/* ===== تبدیل تاریخ جلالی ↔ میلادی ===== */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const y2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const isoJ=iso=>{const[y,m,d]=iso.split('-').map(Number);return g2j(y,m,d)};
const showDate=iso=>{if(!iso)return'—';const[y,m,d]=isoJ(iso);return fa(d)+' '+MONTHS[m-1]+' '+fa(y)};
const inDate=iso=>{const[y,m,d]=isoJ(iso);return fa(y+'/'+pad(m)+'/'+pad(d))};
function parseJ(s){const p=en(s).split('/').map(Number);if(p.length!==3||p.some(isNaN))return null;const[y,m,d]=p;if(y<1200||y>1600||m<1||m>12||d<1||d>31)return null;const g=j2g(y,m,d),b=g2j(g[0],g[1],g[2]);if(b[0]!==y||b[1]!==m||b[2]!==d)return null;return g[0]+'-'+pad(g[1])+'-'+pad(g[2])}

/* ===== داده ===== */
const DEF=()=>({customers:[],services:[],income:[],invoices:[],settings:{password:'123456',prefix:'BH-',next:1,card:'',owner:'',address:'قم پردیسان بلوار امام صادق، خیابان اندیشه.'}});
let db=DEF();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.customers){db=Object.assign(DEF(),r);db.settings=Object.assign(DEF().settings,r.settings); Debug.add('info', 'داده‌ها از حافظه مرورگر (LocalStorage) خوانده شد.')}}catch(e){}

const save=()=>{
  Debug.add('info', 'درخواست ذخیره‌سازی آغاز شد...');
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){ Debug.add('error', 'خطا در ذخیره در مرورگر: ' + e.message); }
  
  if(supabaseClient){
    supabaseClient.from('baharan_data').upsert({id:'main',data:db,updated_at:new Date().toISOString()}).then(({error})=>{
      if(error){
        Debug.add('error', 'خطا در ذخیره روی سرور: ' + error.message);
      } else {
        Debug.add('success', 'اطلاعات با موفقیت روی سرور ذخیره شد.');
      }
    }).catch(err => Debug.add('error', 'خطای شبکه در ذخیره: ' + err.message));
  } else {
    Debug.add('warn', 'سرور متصل نیست. فقط در مرورگر ذخیره شد.');
  }
};

async function loadCloudData(){
  if(!supabaseClient){
    Debug.add('error', 'امکان دریافت اطلاعات نیست: سرور متصل نیست.');
    return;
  }
  Debug.add('info', 'در حال دریافت اطلاعات از سرور Supabase...');
  try {
    const {data, error} = await supabaseClient.from('baharan_data').select('data').eq('id','main').maybeSingle();
    if(error) throw error;
    if(data && data.data){
      Debug.add('success', 'اطلاعات با موفقیت از سرور دریافت شد.');
      db = Object.assign(DEF(), data.data);
      db.settings = Object.assign(DEF().settings, data.data.settings);
      if(sessionStorage.getItem('baharan_auth')==='1') render();
    } else {
      Debug.add('warn', 'هیچ اطلاعاتی روی سرور یافت نشد (جدول خالی است).');
    }
  } catch(e) { 
    Debug.add('error', 'خطا در دریافت اطلاعات: ' + e.message); 
  }
}

function fh(F,v={}){return F.map(f=>{const id='f_'+f.k,val=v[f.k]==null?'':v[f.k];
if(f.t=='area')return`<label>${f.l}${f.r?' *':''}<textarea id="${id}">${esc(val)}</textarea></label>`;
if(f.t=='chk')return`<label class="chk"><input type="checkbox" id="${id}" ${val?'checked':''}> ${f.l}</label>`;
const c=f.t=='date'?'jalali-date':(f.t=='num'||f.t=='tel')?'num-input':'';
return`<label>${f.l}${f.r?' *':''}<input id="${id}" class="${c}" ${f.t=='tel'?'maxlength="11"':''} ${c?'inputmode="numeric"':''} ${f.list?`list="${f.list}"`:''} value="${esc(val)}" autocomplete="off"></label>`}).join('')}
function fr(F){const o={};for(const f of F){const e=$('#f_'+f.k);let v=f.t=='chk'?e.checked:e.value.trim();
if(f.r&&!v){toast(f.l+' الزامی است','err');return null}
if(f.t=='tel'){v=en(v);if(v&&!/^0\d{10}$/.test(v)){toast('شماره تماس باید ۱۱ رقم و با ۰ شروع شود','err');return null}}
if(f.t=='date'){v=v?parseJ(v):'';if(f.r&&!v){toast('تاریخ شمسی معتبر نیست','err');return null}}
if(f.t=='num')v=+en(v).replace(/\D/g,'')||0;
o[f.k]=v}return o}

const num=id=>+en($(id).value).replace(/[^\d.]/g,'')||0;
function collect(){const m=$('#iMode').value,v=$('#iCust').value,svc=m=='s'?db.services.find(s=>s.id===v):null,c=cu(svc?svc.custId:v)||null;
const items=[...document.querySelectorAll('#iItems .irow')].map(r=>{const i=r.querySelectorAll('input');return{d:i[0].value.trim(),q:+en(i[1].value).replace(/[^\d.]/g,'')||0,p:+en(i[2].value).replace(/[^\d.]/g,'')||0}}).filter(i=>i.d||i.p);
const labor=num('#iLab'),disc=num('#iDis'),taxp=num('#iTax'),r=calc(items,labor,disc,taxp);
const ev=editInv&&db.invoices.find(x=>x.id===editInv);
return{no:ev?ev.no:db.settings.prefix+db.settings.next,date:parseJ($('#iDate').value)||'',name:c?c.name:'',custId:c?c.id:'',serviceId:svc?svc.id:(ev?ev.serviceId:''),items,labor,disc,taxp,notes:$('#iNote').value.trim(),...r}}
function prev(){const e=$('#iPrev');if(!e||cur!=='inv')return;e.innerHTML=invHTML(collect());const w=e.clientWidth;e.firstChild.style.zoom=Math.min(1,(w||794)/794)}
function saveInv(){const o=collect();if(!o.custId){toast('مشتری را انتخاب کنید','err');return}if(!o.date){toast('تاریخ شمسی معتبر نیست','err');return}
if(!o.items.length&&!o.labor){toast('حداقل یک قلم یا اجرت وارد کنید','err');return}
const ev=editInv&&db.invoices.find(x=>x.id===editInv);
if(ev){Object.assign(ev,o);let r=db.income.find(x=>x.invId===ev.id);if(!r){r={id:uid(),source:'invoice',invId:ev.id};db.income.push(r)}Object.assign(r,{date:o.date,desc:'فاکتور '+o.no,amount:o.total,custId:o.custId});editInv=null;commit();toast('فاکتور ویرایش و جدول مالی به‌روز شد');return}
const v={id:uid(),createdAt:Date.now(),...o};db.invoices.push(v);db.income.push({id:uid(),date:o.date,desc:'فاکتور '+o.no,amount:o.total,custId:o.custId,source:'invoice',invId:v.id});
const s=db.services.find(x=>x.id===o.serviceId);if(s)s.done=true;db.settings.next++;commit();toast('فاکتور ذخیره و درآمد ثبت شد')}
function printCur(){const o=collect();if(!o.custId){toast('ابتدا مشتری را انتخاب کنید','err');return}showPV(invHTML(o))}
function printSaved(id){showPV(invHTML(db.invoices.find(v=>v.id===id)))}
function showPV(h){$('#pvb').innerHTML=h;$('#pvb').firstChild.style.zoom=Math.min(1,innerWidth/800);document.body.classList.add('print-preview')}
function closePV(){document.body.classList.remove('print-preview')}
function dlInv(){const css=$('#invcss').textContent+'body{margin:0;background:#fff}@page{size:A4;margin:0}',h='<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور</title><style>'+css+'</style></head><body>'+$('#pvb').innerHTML.replace(/zoom:[^;"]*;?/,'')+'</body></html>';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='invoice-'+Date.now()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* --- تنظیمات --- */
function vSet(){const s=db.settings,l=location.origin==='null'||location.protocol==='file:'?location.href.split('#')[0]+'#request':location.origin+location.pathname+'#request';
return`<div class="glass"><h2>لینک درخواست مشتریان</h2><input readonly id="lnk" value="${esc(l)}" dir="ltr" onclick="this.select()"><br><br><button class="btn" onclick="cpLink()">کپی لینک</button><button class="btn g" onclick="pull()">دریافت درخواست‌های جدید از سرور</button></div>
<div class="glass"><h2>تنظیمات فاکتور</h2><label>پیشوند شماره<input id="s_prefix" value="${esc(s.prefix)}" dir="ltr"></label><label>شماره بعدی<input id="s_next" class="num-input" inputmode="numeric" value="${fa(s.next)}"></label><label>شماره کارت (۱۶ رقم)<input id="s_card" class="num-input" inputmode="numeric" maxlength="16" value="${fa(s.card)}"></label><label>صاحب کارت<input id="s_owner" value="${esc(s.owner)}"></label><label>آدرس<textarea id="s_addr">${esc(s.address)}</textarea></label><button class="btn" onclick="saveSet()">ذخیره تنظیمات</button></div>
<div class="glass"><h2>امنیت و دسترسی</h2><label>رمز عبور جدید<input type="password" id="s_pass"></label><button class="btn" onclick="chPass()">تغییر رمز عبور</button></div>
<div class="glass"><h2>پشتیبان‌گیری و ریست</h2><button class="btn" onclick="bk()">دانلود پشتیبان JSON</button><label style="margin-top:12px">بازیابی از فایل<input type="file" accept=".json" onchange="rs(this)"></label><br><button class="btn d" onclick="resetAll()">ریست کل سایت</button></div>`}
function resetAll(){if(!confirm('تمام اطلاعات (مشتریان، خدمات، مالی، فاکتورها و تنظیمات) حذف می‌شود. ادامه می‌دهید؟'))return;if(!confirm('این کار قابل بازگشت نیست. از اطلاعات یک فایل پشتیبان دانلود می‌شود. حذف نهایی انجام شود؟'))return;
bk();setTimeout(()=>{try{localStorage.removeItem(KEY);sessionStorage.clear()}catch(e){}location.reload()},800)}
function cpLink(){const e=$('#lnk');e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('کپی شد'),()=>{document.execCommand('copy');toast('کپی شد')})}catch(x){document.execCommand('copy');toast('کپی شد')}}
function saveSet(){const s=db.settings,c=en($('#s_card').value).replace(/\D/g,'');if(c&&c.length!==16){toast('شماره کارت باید ۱۶ رقم باشد','err');return}const n=parseInt(en($('#s_next').value))||1;
Object.assign(s,{prefix:$('#s_prefix').value.trim(),next:Math.max(1,n),card:c,owner:$('#s_owner').value.trim(),address:$('#s_addr').value.trim()});save();toast('تنظیمات ذخیره شد')}
function chPass(){const p=en($('#s_pass').value);if(p.length<6){toast('رمز باید حداقل ۶ کاراکتر باشد','err');return}db.settings.password=p;save();$('#s_pass').value='';toast('رمز عبور تغییر کرد')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='baharan-backup-'+todayIso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.customers)||!Array.isArray(o.services))throw 0;if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;db=Object.assign(DEF(),o);db.settings=Object.assign(DEF().settings,o.settings);commit();toast('بازیابی انجام شد')}catch(e){toast('فایل پشتیبان معتبر نیست','err')}};r.readAsText(f)}

/* ===== فرم عمومی و سرور ===== */
function addReq(o){let c=db.customers.find(x=>x.phone===o.phone);
if(c)c.address=o.address;else{c={id:uid(),createdAt:Date.now(),name:o.name,phone:o.phone,address:o.address};db.customers.push(c)}
db.services.push({id:uid(),createdAt:Date.now(),custId:c.id,service:o.service,date:o.date||todayIso(),desc:'',done:false,source:'online'})}

async function pubSubmit(){
  const o=fr(PF); if(!o) return; if(!o.date) o.date=todayIso();
  
  Debug.add('info', 'درخواست مشتری در حال ارسال به سرور...');
  
  if(supabaseClient){
    try{
      const { error } = await supabaseClient.from('baharan_requests').insert([{
        name: o.name,
        phone: o.phone,
        address: o.address,
        service: o.service,
        date: o.date
      }]);
      if (error) throw error;
      Debug.add('success', 'درخواست با موفقیت در دیتابیس ثبت شد.');
    }catch(e){ 
      Debug.add('error', 'خطا در ثبت درخواست: ' + e.message); 
    }
  }
  
  addReq(o); save();
  $('#pubForm').innerHTML='<div class="empty">✅ درخواست شما ثبت شد. به‌زودی تماس می‌گیریم.</div>';
  toast('درخواست ثبت شد');
}

async function pull(){
  if(!supabaseClient){ toast('اتصال به سرور برقرار نیست','err'); Debug.add('error', 'سرور متصل نیست.'); return; }
  Debug.add('info', 'در حال دریافت درخواست‌ها از سرور...');
  try{
    const {data, error} = await supabaseClient.from('baharan_requests').select('*');
    if(error) throw error;
    
    let n=0;
    (data||[]).forEach(o=>{
      if(o && o.name && /^0\d{10}$/.test(o.phone||'') && o.service){
        addReq(o); n++;
      }
    });
    
    if(n>0){
      // پاک کردن درخواست‌های دریافت شده از سرور
      const { error: delError } = await supabaseClient.from('baharan_requests').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      if (delError) Debug.add('warn', 'خطا در پاکسازی درخواست‌های قدیمی: ' + delError.message);
      Debug.add('success', `${n} درخواست جدید دریافت و به لیست اضافه شد.`);
    } else {
      Debug.add('info', 'هیچ درخواست جدیدی در سرور یافت نشد.');
    }
    
    commit(); toast(fa(n)+' درخواست دریافت شد');
  }catch(e){ 
    Debug.add('error', 'خطا در دریافت درخواست‌ها: ' + e.message); 
    toast('اتصال به سرور ناموفق بود','err'); 
  }
}

/* ===== PWA ===== */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});

// شروع برنامه
route();
loadCloudData(); // دریافت اطلاعات از سرور موقع باز شدن سایت
</script>
